# Rate Limiting Bölgesi (Webhook ve API Spam Koruması)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream api_backend {
    server api:4000;
    keepalive 32;
}

upstream web_frontend {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Proxy Genel Başlıklar
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Telegram Webhook Yönlendirmesi
    location /webhook/ {
        limit_req zone=webhook_limit burst=50 nodelay;
        proxy_pass http://api_backend/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Takipli Kısa Link Yönlendirmesi
    location /r/ {
        proxy_pass http://api_backend/r/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    # REST API Proxy Yönlendirmesi
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js Yönetim Paneli Frontend Proxy
    location / {
        proxy_pass http://web_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
