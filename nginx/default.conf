# Rate Limiting Bölgesi (Webhook ve API Spam Koruması)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Docker Embedded DNS Resolver (Konteyner IP değişikliklerini canlı günceller)
    resolver 127.0.0.11 valid=5s;

    # Proxy Genel Başlıklar
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Telegram Webhook Yönlendirmesi
    location /webhook/ {
        set $api_service "http://api:4000";
        proxy_pass $api_service;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Takipli Kısa Link Yönlendirmesi
    location /r/ {
        set $api_service "http://api:4000";
        proxy_pass $api_service;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    # REST API Proxy Yönlendirmesi
    location /api/ {
        set $api_service "http://api:4000";
        proxy_pass $api_service;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Next.js Yönetim Paneli Frontend Proxy
    location / {
        set $web_service "http://web:3000";
        proxy_pass $web_service;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
