# Upstream tanımlamaları (Kalıcı HTTP/1.1 bağlantı havuzu)
upstream api_backend {
    server api:4000;
    keepalive 64;
}

upstream web_backend {
    server web:3000;
    keepalive 64;
}

# Rate Limiting Bölgesi
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Büyük fotoğraf yüklemeleri için body limit (base64 ~5MB foto ~= 7MB JSON)
    client_max_body_size 25m;

    # Proxy Genel Başlıklar
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Telegram Webhook Yönlendirmesi
    location /webhook/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Takipli Kısa Link Yönlendirmesi
    location /r/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # REST API Proxy Yönlendirmesi
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
    }

    # Next.js Yönetim Paneli Frontend Proxy
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
    }
}
