# ============================================================
# IP ile Direkt Erişim Modu (SSL olmadan, HTTP üzerinden)
# Kullanım: nginx/default.conf yerine bu dosyayı kullan
# WEBHOOK_BASE_URL = http://VDS_IP:4000 (Polling modu önerilir)
# ============================================================

upstream api_backend {
    server api:4000;
    keepalive 32;
}

upstream web_frontend {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Proxy Genel Başlıklar
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Takipli Kısa Link Yönlendirmesi
    location /r/ {
        proxy_pass http://api_backend/r/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    # REST API
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js Yönetim Paneli
    location / {
        proxy_pass http://web_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
